<!doctype html><html><head><meta charset="utf-8"><title>rig test</title><style>body{margin:0;background:#888}</style></head><body>
<!-- Prueba del retarget (src/rig.js): nuestro personaje y modelos Mixamo con la misma pose. Copiar a la raíz del repo, bajar los modelos a public/test/ (no se suben: tienen licencia Mixamo) y abrir con npx vite: http://localhost:5173/rigtest.html. En consola: __pose("walk", 0, 1.4), __pose("cross", 0.5), __pose("sit"), __pose("dead", 0.2). -->
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { makeHuman, animateHuman, randomCivilian } from '/src/human.js';
import { rigHuman } from '/src/rig.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa8b8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 5); scene.add(sun);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 1.3, 6.2); cam.lookAt(0, 0.95, 0);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x556655 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const L = new GLTFLoader();
const hs = [makeHuman({ ...randomCivilian(), female: false, top: 'tshirt', shirt: 0x2e7d32 })];
for (const f of ['Xbot', 'Michelle']) { const g = await L.loadAsync('/public/test/' + f + '.glb' /* bajar con: curl -L -o public/test/Xbot.glb https://raw.githubusercontent.com/mrdoob/three.js/r170/examples/models/gltf/Xbot.glb (y Michelle) */); hs.push(rigHuman(g.scene, { female: f === 'Michelle' })); }
hs.forEach((h, i) => { h.root.position.x = (i - 1) * 1.3; scene.add(h.root); });
window.__pose = (pose, t = 0.5, speed = 0) => { for (const h of hs) animateHuman(h, 0.016, speed, pose, t); r.render(scene, cam); return 'ok'; };
window.__ready = true;
__pose('walk', 0, 1.4);
</script></body></html>
